[project]
name = "analogcoder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
analogcoder = "analogcoder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analogcoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `pytest -m "not slow"` is the normal TDD cycle. Without a registered marker
# pytest warns on every use, and this repo treats a warning as a finding - so
# the marker is declared here rather than left to a per-file pytestmark.
markers = [
    "slow: a real-ngspice test measured in minutes, not seconds (a full PVT sweep or several). Deselect with -m 'not slow' for a normal TDD cycle; run before merging anything under pvt.py, optimizer.py, area.py, corner_sim.py, corner_selection.py or judge_tools.py.",
]
