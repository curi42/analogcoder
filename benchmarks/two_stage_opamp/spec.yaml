circuit_name: two_stage_opamp
testbenches:
  - name: ac_loop_gain
    netlist: netlist.cir
    analyses: ["ac"]
    control_block: |
      .control
      set units=degrees
      ac dec 20 1 100meg
      meas ac gain_db find vdb(vout) at=1
      meas ac ugbw_hz when vdb(vout)=0
      meas ac phase_margin_deg find vp(vout) when vdb(vout)=0
      .endc
    criteria:
      - name: dc_gain
        measurement: gain_db
        operator: ">="
        threshold: 70.0
        unit: dB
      - name: unity_gain_bandwidth
        measurement: ugbw_hz
        operator: ">="
        threshold: 20000000.0
        unit: Hz
      - name: phase_margin
        measurement: phase_margin_deg
        operator: ">="
        threshold: 60.0
        unit: deg

  - name: psr_plus
    netlist: netlist_psr_plus.cir
    analyses: ["ac"]
    control_block: |
      .control
      ac dec 20 1 100meg
      meas ac psr_plus_db find vdb(vout) at=1
      .endc
    criteria:
      - name: psr_plus
        measurement: psr_plus_db
        operator: "<="
        threshold: -10.0
        unit: dB

  - name: psr_minus
    netlist: netlist_psr_minus.cir
    analyses: ["ac"]
    control_block: |
      .control
      ac dec 20 1 100meg
      meas ac psr_minus_db find vdb(vout) at=1
      .endc
    criteria:
      - name: psr_minus
        measurement: psr_minus_db
        operator: "<="
        threshold: -8.0
        unit: dB
