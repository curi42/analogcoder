# Kuijk bandgap reference chain. Every threshold here is set loosely around a
# MEASURED 45-corner range (5 process x 3 voltage x 3 temperature); the full
# table is in
# docs/superpowers/specs/2026-07-26-bandgap-benchmark-and-scoped-refdes-design.md
# ("Part 2 revision"). Measured range is quoted beside each criterion.
#
# This spec passes everywhere. The point of the benchmark is the seeded
# variants next to it (spec_seed_tc.yaml, spec_seed_trim_pm.yaml,
# spec_seed_buf0_droop.yaml), each of which tightens exactly ONE criterion
# whose only fix lives in one subckt.
# The full +-10% supply axis. This is only reachable because every amplifier is
# a folded cascode: the input pair's drain sits a |Vdsat| below vdd rather than
# a |Vgs| below it, which is worth ~0.5V of input headroom. An earlier 5T-OTA
# version of this circuit had to be specified at +-5%, because at 1.62V the
# trim loop gain collapsed to -45dB and vbg1 fell to 1.084V. If an amp is ever
# simplified back to a mirror load, this axis stops being achievable.
pvt_corners:
  process: ["tt", "ss", "ff", "sf", "fs"]
  voltage: [1.62, 1.8, 1.98]
  temperature: [-40, 27, 125]
circuit_name: bandgap
# Sub-project C, same block as spec.yaml's - see the longer note there. This
# is the copy that can actually optimize, because the 45-corner entry sweep
# gives every criterion a MEASURED allowance and the declared guard_band
# ratio is then only a filler for criteria the sweep leaves uncovered.
optimize:
  objective: iq_ua
  area_budget: 1.10
  guard_band: 0.2
testbenches:
  - name: dc_tc
    netlist: netlist.cir
    analyses: ["dc"]
    control_block: |
      .control
      dc temp -40 125 1
      meas dc vmax MAX v(vbgout)
      meas dc vmin MIN v(vbgout)
      meas dc vbgout_v FIND v(vbgout) AT=27
      meas dc vbg0_v FIND v(vbg0) AT=27
      meas dc vbg1_v FIND v(vbg1) AT=27
      meas dc idd FIND i(Vdd) AT=27
      let tc_ppm_per_c = (vmax-vmin)/(vbgout_v*165)*1e6
      let iq_ua = -1e6*idd
      print vbgout_v vbg0_v vbg1_v iq_ua tc_ppm_per_c
      .endc
    criteria:
      # measured 1.2337 .. 1.2451 V
      - name: vbgout_min
        measurement: vbgout_v
        operator: ">="
        threshold: 1.20
        unit: V
      - name: vbgout_max
        measurement: vbgout_v
        operator: "<="
        threshold: 1.28
        unit: V
      # measured 0.49772 .. 0.50374 V
      - name: vbg0_min
        measurement: vbg0_v
        operator: ">="
        threshold: 0.475
        unit: V
      - name: vbg0_max
        measurement: vbg0_v
        operator: "<="
        threshold: 0.525
        unit: V
      # measured 1.1959 .. 1.2054 V
      - name: vbg1_min
        measurement: vbg1_v
        operator: ">="
        threshold: 1.14
        unit: V
      - name: vbg1_max
        measurement: vbg1_v
        operator: "<="
        threshold: 1.26
        unit: V
      # measured 31.3 .. 53.9 ppm/C
      - name: temperature_coefficient
        measurement: tc_ppm_per_c
        operator: "<="
        threshold: 70.0
        unit: ppm/C
      # measured 193 .. 235 uA. Deliberately loose: this circuit is the input
      # to the later area/current minimisation sub-project, so it should have
      # room to be optimised rather than already sit against its limit.
      - name: quiescent_current
        measurement: iq_ua
        operator: "<="
        threshold: 300.0
        unit: uA

  - name: startup
    netlist: netlist_startup.cir
    analyses: ["tran"]
    control_block: |
      .control
      tran 20n 100u uic
      meas tran t_up WHEN v(vbgout)=1.15 RISE=1
      let startup_time = t_up
      print startup_time
      .endc
    criteria:
      # measured 74.8ns .. 9.75us; the slow end is sf/1.62V/-40C
      - name: startup_time
        measurement: startup_time
        operator: "<="
        threshold: 0.00002
        unit: s

  - name: psrr
    netlist: netlist_psrr.cir
    analyses: ["ac"]
    control_block: |
      .control
      ac dec 20 1 10meg
      meas ac psrr_bg_db FIND vdb(vbgout) AT=1
      .endc
    criteria:
      # measured -51.1 .. -31.0 dB
      - name: psrr_dc
        measurement: psrr_bg_db
        operator: "<="
        threshold: -25.0
        unit: dB

  - name: settling
    netlist: netlist_settling.cir
    analyses: ["tran"]
    control_block: |
      .control
      tran 2n 5u
      meas tran v0pre  FIND v(vbg0) AT=0.9u
      meas tran v1pre  FIND v(vbg1) AT=0.9u
      meas tran v0post FIND v(vbg0) AT=1.5u
      meas tran v1post FIND v(vbg1) AT=1.5u
      meas tran v0dip  MIN v(vbg0) FROM=1u TO=1.5u
      meas tran v1dip  MIN v(vbg1) FROM=1u TO=1.5u
      let vbg0_droop_mv = (v0pre-v0dip)*1e3
      let vbg1_droop_mv = (v1pre-v1dip)*1e3
      let vbg0_resid_mv = abs(v0post-v0pre)*1e3
      let vbg1_resid_mv = abs(v1post-v1pre)*1e3
      print vbg0_droop_mv vbg1_droop_mv vbg0_resid_mv vbg1_resid_mv
      .endc
    criteria:
      # measured 17.0 .. 31.6 mV
      - name: vbg0_droop
        measurement: vbg0_droop_mv
        operator: "<="
        threshold: 50.0
        unit: mV
      # measured 19.6 .. 27.8 mV
      - name: vbg1_droop
        measurement: vbg1_droop_mv
        operator: "<="
        threshold: 50.0
        unit: mV
      # measured <1 mV everywhere: this is the "did it actually re-settle"
      # guard rather than a discriminating criterion at baseline.
      - name: vbg0_residual
        measurement: vbg0_resid_mv
        operator: "<="
        threshold: 5.0
        unit: mV
      - name: vbg1_residual
        measurement: vbg1_resid_mv
        operator: "<="
        threshold: 5.0
        unit: mV

  - name: amp_loops
    netlist: netlist_loops.cir
    analyses: ["ac"]
    control_block: |
      .control
      set units=degrees
      alter @Vsc[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(ampout)-vdb(mpgate)
      let tph  = vp(ampout)-vp(mpgate)
      meas ac core_gain_db FIND tmag AT=1
      meas ac core_pm_deg  FIND tph WHEN tmag=0
      alter @Vsc[acmag] = 0
      alter @Vst[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vfb)-vdb(trm_i)
      let tph  = vp(vfb)-vp(trm_i)
      meas ac trim_gain_db FIND tmag AT=1
      meas ac trim_pm_deg  FIND tph WHEN tmag=0
      alter @Vst[acmag] = 0
      alter @Vs1[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vbg1)-vdb(b1_i)
      let tph  = vp(vbg1)-vp(b1_i)
      meas ac buf1_gain_db FIND tmag AT=1
      meas ac buf1_pm_deg  FIND tph WHEN tmag=0
      alter @Vs1[acmag] = 0
      alter @Vs0[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vbg0)-vdb(b0_i)
      let tph  = vp(vbg0)-vp(b0_i)
      meas ac buf0_gain_db FIND tmag AT=1
      meas ac buf0_pm_deg  FIND tph WHEN tmag=0
      .endc
    criteria:
      # measured 45.2 .. 65.1 dB / 58.3 .. 78.4 deg
      - name: core_loop_gain
        measurement: core_gain_db
        operator: ">="
        threshold: 40.0
        unit: dB
      - name: core_phase_margin
        measurement: core_pm_deg
        operator: ">="
        threshold: 50.0
        unit: deg
      # measured 76.9 .. 95.9 dB / 78.8 .. 86.2 deg
      - name: trim_loop_gain
        measurement: trim_gain_db
        operator: ">="
        threshold: 60.0
        unit: dB
      - name: trim_phase_margin
        measurement: trim_pm_deg
        operator: ">="
        threshold: 70.0
        unit: deg
      # measured 88.4 .. 105.9 dB / 94.0 .. 111.9 deg
      - name: buf1_loop_gain
        measurement: buf1_gain_db
        operator: ">="
        threshold: 70.0
        unit: dB
      - name: buf1_phase_margin
        measurement: buf1_pm_deg
        operator: ">="
        threshold: 80.0
        unit: deg
      # measured 74.9 .. 104.9 dB / 91.4 .. 112.1 deg
      - name: buf0_loop_gain
        measurement: buf0_gain_db
        operator: ">="
        threshold: 60.0
        unit: dB
      - name: buf0_phase_margin
        measurement: buf0_pm_deg
        operator: ">="
        threshold: 80.0
        unit: deg
