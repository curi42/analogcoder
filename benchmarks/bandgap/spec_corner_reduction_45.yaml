# T18 - 순수 argmax 코너 축소를 **45코너** 격자에서 재는 스펙. spec_pvt.yaml의
# 복사본이며 다른 점은 셋뿐이다: corner_reduction 블록을 더하고, optimize
# 블록을 빼고, 이 헤더를 새로 썼다. 테스트벤치·기준·pvt_corners(45코너,
# process x voltage x temperature = 5x3x3)는 spec_pvt.yaml과 바이트 동일하다.
#
# **왜 존재하는가.** `spec_corner_reduction.yaml`(9코너)에서는 축소가 아무것도
# 사지 못했다 - 씨앗이 격자 전체(min(#criteria, #corners), 이 스펙 둘 다
# criterion이 22개)를 삼켜 6/9가 씨앗이 되고 남는 3개(전부 tt)는 누구의
# 최악도 아니었다. CLAUDE.md와 이 저장소의 재진입 투영
# (scripts/reentry_feasibility.py)이 공통으로 가리키는 것은 "축소가 값을 갖는
# 체제는 코너 수가 criterion 수를 크게 웃도는 곳"이다 - 9코너는 그 반대편이고
# 45코너가 그 체제다(투영: 씨앗 9 / 점당tb 11 / 집합밖 36, 45코너 격자에서의
# 재진입 투영은 21/242 발화인데 9코너에서는 0/242다). 이 스펙은 그 투영을
# **실측**으로 바꾸는 첫 스펙이다(T18, 2026-07-30).
#
# **spec_corner_reduction.yaml과의 차이는 코너 격자 하나뿐이다.** 9코너
# (process 3 x voltage 3 x temperature 1)에서 45코너
# (process 5 x voltage 3 x temperature 3)로. corner_reduction 블록의 값
# (retry_budget=2, probe=true)은 그대로 옮겼다 - 이 측정이 재려는 것은 격자
# 크기가 축소 산출물을 어떻게 바꾸는가이지, 예산 정책의 변화가 아니다.
#
# **optimize를 뺀 이유는 spec_pvt.yaml/spec_corner_reduction.yaml과 같은
# 근거다.** 최적화 단계는 확인이 실패하면 이분 탐색으로 45코너 스윕을 최대
# 여섯 번 돌리고(CLAUDE.md, "corner-anchored run costs 1790 s"), 그 회수는
# 실행마다 다르다 - 코너 축소 자체의 비용(테스트벤치당 점 수, 시뮬레이션 총수,
# 벽시계)을 재려는 측정에서 최적화 단계의 가변 비용이 섞이면 무엇을 재는지
# 알 수 없게 된다. `spec_pvt.yaml`의 45코너 격자와 `optimize:` 블록은 다른
# 측정(test_optimizer_bandgap_ngspice.py 등)이 인용하므로 그 파일 자체는
# 손대지 않는다.
pvt_corners:
  process: ["tt", "ss", "ff", "sf", "fs"]
  voltage: [1.62, 1.8, 1.98]
  temperature: [-40, 27, 125]
corner_reduction:
  enabled: true
  retry_budget: 2
  probe: true
circuit_name: bandgap
testbenches:
  - name: dc_tc
    netlist: netlist.cir
    analyses: ["dc"]
    control_block: |
      .control
      dc temp -40 125 1
      meas dc vmax MAX v(vbgout)
      meas dc vmin MIN v(vbgout)
      meas dc vbgout_v FIND v(vbgout) AT=27
      meas dc vbg0_v FIND v(vbg0) AT=27
      meas dc vbg1_v FIND v(vbg1) AT=27
      meas dc idd FIND i(Vdd) AT=27
      let tc_ppm_per_c = (vmax-vmin)/(vbgout_v*165)*1e6
      let iq_ua = -1e6*idd
      print vbgout_v vbg0_v vbg1_v iq_ua tc_ppm_per_c
      .endc
    criteria:
      # measured 1.2337 .. 1.2451 V
      - name: vbgout_min
        measurement: vbgout_v
        operator: ">="
        threshold: 1.20
        unit: V
      - name: vbgout_max
        measurement: vbgout_v
        operator: "<="
        threshold: 1.28
        unit: V
      # measured 0.49772 .. 0.50374 V
      - name: vbg0_min
        measurement: vbg0_v
        operator: ">="
        threshold: 0.475
        unit: V
      - name: vbg0_max
        measurement: vbg0_v
        operator: "<="
        threshold: 0.525
        unit: V
      # measured 1.1959 .. 1.2054 V
      - name: vbg1_min
        measurement: vbg1_v
        operator: ">="
        threshold: 1.14
        unit: V
      - name: vbg1_max
        measurement: vbg1_v
        operator: "<="
        threshold: 1.26
        unit: V
      # measured 31.3 .. 53.9 ppm/C
      - name: temperature_coefficient
        measurement: tc_ppm_per_c
        operator: "<="
        threshold: 70.0
        unit: ppm/C
      # measured 193 .. 235 uA. Deliberately loose: this circuit is the input
      # to the later area/current minimisation sub-project, so it should have
      # room to be optimised rather than already sit against its limit.
      - name: quiescent_current
        measurement: iq_ua
        operator: "<="
        threshold: 300.0
        unit: uA

  - name: startup
    netlist: netlist_startup.cir
    analyses: ["tran"]
    control_block: |
      .control
      tran 20n 100u uic
      meas tran t_up WHEN v(vbgout)=1.15 RISE=1
      let startup_time = t_up
      print startup_time
      .endc
    criteria:
      # measured 74.8ns .. 9.75us; the slow end is sf/1.62V/-40C
      - name: startup_time
        measurement: startup_time
        operator: "<="
        threshold: 0.00002
        unit: s

  - name: psrr
    netlist: netlist_psrr.cir
    analyses: ["ac"]
    control_block: |
      .control
      ac dec 20 1 10meg
      meas ac psrr_bg_db FIND vdb(vbgout) AT=1
      .endc
    criteria:
      # measured -51.1 .. -31.0 dB
      - name: psrr_dc
        measurement: psrr_bg_db
        operator: "<="
        threshold: -25.0
        unit: dB

  - name: settling
    netlist: netlist_settling.cir
    analyses: ["tran"]
    control_block: |
      .control
      tran 2n 5u
      meas tran v0pre  FIND v(vbg0) AT=0.9u
      meas tran v1pre  FIND v(vbg1) AT=0.9u
      meas tran v0post FIND v(vbg0) AT=1.5u
      meas tran v1post FIND v(vbg1) AT=1.5u
      meas tran v0dip  MIN v(vbg0) FROM=1u TO=1.5u
      meas tran v1dip  MIN v(vbg1) FROM=1u TO=1.5u
      let vbg0_droop_mv = (v0pre-v0dip)*1e3
      let vbg1_droop_mv = (v1pre-v1dip)*1e3
      let vbg0_resid_mv = abs(v0post-v0pre)*1e3
      let vbg1_resid_mv = abs(v1post-v1pre)*1e3
      print vbg0_droop_mv vbg1_droop_mv vbg0_resid_mv vbg1_resid_mv
      .endc
    criteria:
      # measured 17.0 .. 31.6 mV
      - name: vbg0_droop
        measurement: vbg0_droop_mv
        operator: "<="
        threshold: 50.0
        unit: mV
      # measured 19.6 .. 27.8 mV
      - name: vbg1_droop
        measurement: vbg1_droop_mv
        operator: "<="
        threshold: 50.0
        unit: mV
      # measured <1 mV everywhere: this is the "did it actually re-settle"
      # guard rather than a discriminating criterion at baseline.
      - name: vbg0_residual
        measurement: vbg0_resid_mv
        operator: "<="
        threshold: 5.0
        unit: mV
      - name: vbg1_residual
        measurement: vbg1_resid_mv
        operator: "<="
        threshold: 5.0
        unit: mV

  - name: amp_loops
    netlist: netlist_loops.cir
    analyses: ["ac"]
    control_block: |
      .control
      set units=degrees
      alter @Vsc[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(ampout)-vdb(mpgate)
      let tph  = vp(ampout)-vp(mpgate)
      meas ac core_gain_db FIND tmag AT=1
      meas ac core_pm_deg  FIND tph WHEN tmag=0
      alter @Vsc[acmag] = 0
      alter @Vst[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vfb)-vdb(trm_i)
      let tph  = vp(vfb)-vp(trm_i)
      meas ac trim_gain_db FIND tmag AT=1
      meas ac trim_pm_deg  FIND tph WHEN tmag=0
      alter @Vst[acmag] = 0
      alter @Vs1[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vbg1)-vdb(b1_i)
      let tph  = vp(vbg1)-vp(b1_i)
      meas ac buf1_gain_db FIND tmag AT=1
      meas ac buf1_pm_deg  FIND tph WHEN tmag=0
      alter @Vs1[acmag] = 0
      alter @Vs0[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vbg0)-vdb(b0_i)
      let tph  = vp(vbg0)-vp(b0_i)
      meas ac buf0_gain_db FIND tmag AT=1
      meas ac buf0_pm_deg  FIND tph WHEN tmag=0
      .endc
    criteria:
      # measured 45.2 .. 65.1 dB / 58.3 .. 78.4 deg
      - name: core_loop_gain
        measurement: core_gain_db
        operator: ">="
        threshold: 40.0
        unit: dB
      - name: core_phase_margin
        measurement: core_pm_deg
        operator: ">="
        threshold: 50.0
        unit: deg
      # measured 76.9 .. 95.9 dB / 78.8 .. 86.2 deg
      - name: trim_loop_gain
        measurement: trim_gain_db
        operator: ">="
        threshold: 60.0
        unit: dB
      - name: trim_phase_margin
        measurement: trim_pm_deg
        operator: ">="
        threshold: 70.0
        unit: deg
      # measured 88.4 .. 105.9 dB / 94.0 .. 111.9 deg
      - name: buf1_loop_gain
        measurement: buf1_gain_db
        operator: ">="
        threshold: 70.0
        unit: dB
      - name: buf1_phase_margin
        measurement: buf1_pm_deg
        operator: ">="
        threshold: 80.0
        unit: deg
      # measured 74.9 .. 104.9 dB / 91.4 .. 112.1 deg
      - name: buf0_loop_gain
        measurement: buf0_gain_db
        operator: ">="
        threshold: 60.0
        unit: dB
      - name: buf0_phase_margin
        measurement: buf0_pm_deg
        operator: ">="
        threshold: 80.0
        unit: deg
