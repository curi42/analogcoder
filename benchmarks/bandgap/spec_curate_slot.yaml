# 큐레이션(F2) 슬롯 스펙. 단일 테스트벤치(amp_loops)에 spec_corner_reduction.yaml의
# 9코너 격자를 그대로 붙였다 - 저술본(소스 C) 후보가 2.5단(코너 검증)을 실제로
# 통과할 수 있는 슬롯이 필요해서다: spec_seed_topology.yaml은 pvt_corners를
# 선언하지 않으므로 그 슬롯에서는 저술본이 코너 없이는 절대 ADMIT되지 못하고
# (verify_corners가 inconclusive) 항상 INCONCLUSIVE로 멈춘다.
#
# 단일 테스트벤치인 이유는 비용이다 - 3단(범위 밝힌 비교)은 노브 수 x N점 x
# 테스트벤치 수만큼 시뮬레이션을 돈다(코너 축소가 이미 겪은 것과 같은 곱셈).
# 검증 슬롯은 여러 테스트벤치를 겹치지 않는 것이 문서화된 권장이라 amp_loops
# 하나만 남겼다.
#
# optimize:도 corner_reduction:도 없다 - 이 스펙은 큐레이션 게이트를 재는
# 것이지 최적화나 중간 루프 코너 축소를 재는 것이 아니다.
pvt_corners:
  process: ["tt", "ss", "ff"]
  voltage: [1.62, 1.8, 1.98]
  temperature: [27]
circuit_name: bandgap
testbenches:
  - name: amp_loops
    netlist: netlist_loops.cir
    analyses: ["ac"]
    control_block: |
      .control
      set units=degrees
      alter @Vsc[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(ampout)-vdb(mpgate)
      let tph  = vp(ampout)-vp(mpgate)
      meas ac core_gain_db FIND tmag AT=1
      meas ac core_pm_deg  FIND tph WHEN tmag=0
      alter @Vsc[acmag] = 0
      alter @Vst[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vfb)-vdb(trm_i)
      let tph  = vp(vfb)-vp(trm_i)
      meas ac trim_gain_db FIND tmag AT=1
      meas ac trim_pm_deg  FIND tph WHEN tmag=0
      alter @Vst[acmag] = 0
      alter @Vs1[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vbg1)-vdb(b1_i)
      let tph  = vp(vbg1)-vp(b1_i)
      meas ac buf1_gain_db FIND tmag AT=1
      meas ac buf1_pm_deg  FIND tph WHEN tmag=0
      alter @Vs1[acmag] = 0
      alter @Vs0[acmag] = 1
      ac dec 20 1 100meg
      let tmag = vdb(vbg0)-vdb(b0_i)
      let tph  = vp(vbg0)-vp(b0_i)
      meas ac buf0_gain_db FIND tmag AT=1
      meas ac buf0_pm_deg  FIND tph WHEN tmag=0
      .endc
    criteria:
      # measured 45.2 .. 65.1 dB / 58.3 .. 78.4 deg (spec_corner_reduction.yaml)
      - name: core_loop_gain
        measurement: core_gain_db
        operator: ">="
        threshold: 40.0
        unit: dB
      - name: core_phase_margin
        measurement: core_pm_deg
        operator: ">="
        threshold: 50.0
        unit: deg
      # measured 76.9 .. 95.9 dB / 78.8 .. 86.2 deg
      - name: trim_loop_gain
        measurement: trim_gain_db
        operator: ">="
        threshold: 60.0
        unit: dB
      - name: trim_phase_margin
        measurement: trim_pm_deg
        operator: ">="
        threshold: 70.0
        unit: deg
      # measured 88.4 .. 105.9 dB / 94.0 .. 111.9 deg
      - name: buf1_loop_gain
        measurement: buf1_gain_db
        operator: ">="
        threshold: 70.0
        unit: dB
      - name: buf1_phase_margin
        measurement: buf1_pm_deg
        operator: ">="
        threshold: 80.0
        unit: deg
      # measured 74.9 .. 104.9 dB / 91.4 .. 112.1 deg
      - name: buf0_loop_gain
        measurement: buf0_gain_db
        operator: ">="
        threshold: 60.0
        unit: dB
      - name: buf0_phase_margin
        measurement: buf0_pm_deg
        operator: ">="
        threshold: 80.0
        unit: deg
